openapi: 3.1.0
info:
  title: Proteus OS Core Engine API
  description: >
    Tài liệu OpenAPI (Swagger) cho phần Backend Core (FastAPI) của Proteus OS.
    Core Engine đóng vai trò là Orchestrator, xử lý vòng đời Plugin và điều phối Tác tử AI (Agentic AI).
  version: 2.0.0
  contact:
    name: ICTU Proteus OS Team
servers:
  - url: http://api.proteus.local/api/v1
    description: Môi trường Development (Local Docker)

components:
  securitySchemes:
    KeycloakBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập Access Token lấy từ Keycloak SSO.

  schemas:
    PluginManifest:
      type: object
      properties:
        code_name:
          type: string
          example: "hr-module"
        manifest_url:
          type: string
          format: uri
          example: "https://raw.githubusercontent.com/.../manifest.yaml"
      required:
        - code_name
        - manifest_url

    AICommandRequest:
      type: object
      properties:
        command:
          type: string
          description: "Mệnh lệnh ngôn ngữ tự nhiên từ Giám đốc"
          example: "Hãy duyệt tất cả đơn xin nghỉ phép trong ngày hôm nay."
      required:
        - command

    StandardResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
        data:
          type: object

security:
  - KeycloakBearerAuth: []

paths:
  /health:
    get:
      summary: Kiểm tra trạng thái hệ thống
      tags:
        - System
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"

  /plugins:
    get:
      summary: Lấy danh sách Plugin đã cài đặt của Tenant hiện tại
      description: Dựa vào JWT Token, hệ thống trích xuất `tenant_id` và trả về các Plugin thuộc về Tenant đó.
      tags:
        - Plugin Marketplace
      responses:
        '200':
          description: Trả về danh sách ứng dụng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /plugins/install:
    post:
      summary: Cài đặt một Plugin mới (Provisioning)
      description: Core Engine sẽ tải manifest, chạy script SQL tạo bảng (Schema-per-tenant), và gọi n8n/Metabase để nạp dữ liệu. Hỗ trợ Auto-Rollback nếu lỗi.
      tags:
        - Plugin Marketplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginManifest'
      responses:
        '202':
          description: Yêu cầu cài đặt đã được tiếp nhận và đang chạy ngầm (Background Task).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /ai/execute:
    post:
      summary: Điều phối Tác tử AI thực thi lệnh (AI Orchestrator)
      description: >
        Nhận lệnh bằng ngôn ngữ tự nhiên. 
        Sử dụng Langchain kết hợp Qdrant (RAG) để phân tích ý định. 
        Chuyển đổi thành luồng ReAct và kích hoạt luồng Webhook trên n8n.
      tags:
        - Agentic AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AICommandRequest'
      responses:
        '200':
          description: Đã gửi lệnh xác nhận (Interactive Message) qua Mattermost thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /plugins/{plugin_id}:
    put:
      summary: Cập nhật (Upgrade) Plugin
      description: Tải manifest mới nhất, chạy script Migration cho Database và nạp lại luồng n8n.
      tags:
        - Plugin Marketplace
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Yêu cầu nâng cấp đang được xử lý ngầm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
    delete:
      summary: Gỡ cài đặt (Uninstall) Plugin
      description: Xóa dữ liệu Plugin khỏi Tenant. Chuyển trạng thái Plugin sang DELETED. Tác tử dọn dẹp (Cleanup Agent) sẽ tự động chạy ngầm để DROP schema và xóa workflow trên n8n.
      tags:
        - Plugin Marketplace
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Yêu cầu gỡ cài đặt đang được xử lý ngầm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /webhooks/mattermost/callback:
    post:
      summary: Webhook Callback từ Mattermost (Phê duyệt của Giám đốc)
      description: >
        Endpoint nhận tín hiệu khi người dùng (Giám đốc) click vào nút [Phê duyệt] hoặc [Từ chối] trên tin nhắn Interactive của Mattermost.
        Nếu Phê duyệt, Core Engine sẽ gọi tiếp n8n để hoàn tất luồng hành động của AI.
      tags:
        - Agentic AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                context:
                  type: object
                  description: Dữ liệu đính kèm (VD action_id)
      responses:
        '200':
          description: Đã nhận lệnh phê duyệt thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
