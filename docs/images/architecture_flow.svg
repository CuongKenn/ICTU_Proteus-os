<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Blue to Neon Purple) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <!-- Glassmorphism Panels -->
    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Component Colors -->
    <linearGradient id="color-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="color-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="color-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="color-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="color-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="color-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="color-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feFlood flood-color="#06b6d4" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-rose" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feFlood flood-color="#f43f5e" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feFlood flood-color="#f59e0b" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feFlood flood-color="#8b5cf6" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="150" x2="1400" y2="150" />
    <line x1="0" y1="300" x2="1400" y2="300" />
    <line x1="0" y1="450" x2="1400" y2="450" />
    <line x1="0" y1="600" x2="1400" y2="600" />
    <line x1="0" y1="750" x2="1400" y2="750" />
    <line x1="300" y1="0" x2="300" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="900" y1="0" x2="900" y2="900" />
    <line x1="1200" y1="0" x2="1200" y2="900" />
  </g>

  <text x="700" y="50" fill="#f8fafc" font-family="system-ui" font-size="32" font-weight="900" letter-spacing="2" text-anchor="middle">PROTEUS OS ARCHITECTURE</text>
  <text x="700" y="80" fill="#94a3b8" font-family="system-ui" font-size="16" letter-spacing="1" text-anchor="middle">Universal Agentic OS with Hexagonal Micro-Kernel</text>

  <!-- Zones -->
  <!-- External Zone -->
  <rect x="50" y="120" width="200" height="660" rx="15" fill="url(#glass-panel)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="150" y="150" fill="#94a3b8" font-family="system-ui" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle">EXTERNAL</text>

  <!-- App & UI Zone -->
  <rect x="300" y="120" width="250" height="660" rx="15" fill="url(#glass-panel)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="425" y="150" fill="#94a3b8" font-family="system-ui" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle">FRONTEND &amp; APPS</text>

  <!-- Core Zone -->
  <rect x="600" y="120" width="450" height="660" rx="15" fill="url(#glass-panel)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="825" y="150" fill="#94a3b8" font-family="system-ui" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle">CORE ENGINE &amp; EVENT BUS</text>

  <!-- Data & AI Zone -->
  <rect x="1100" y="120" width="250" height="660" rx="15" fill="url(#glass-panel)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="1225" y="150" fill="#94a3b8" font-family="system-ui" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle">DATA &amp; AI</text>

  <!-- Path Connections -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Browser -> Traefik -->
    <path id="path-browser-traefik" d="M 150 450 L 250 450" stroke-dasharray="6,6" />
    
    <!-- Traefik -> Frontends -->
    <path id="path-t-next" d="M 250 450 L 350 250" />
    <path id="path-t-appsmith" d="M 250 450 L 350 400" />
    <path id="path-t-metabase" d="M 250 450 L 350 550" />
    <path id="path-t-mattermost" d="M 250 450 L 350 700" />

    <!-- Traefik -> Backend/Auth -->
    <path id="path-t-fastapi" d="M 250 450 C 350 450, 500 450, 650 450" />
    <path id="path-t-keycloak" d="M 250 450 C 350 450, 500 250, 650 250" />

    <!-- Next.js -> FastAPI -->
    <path id="path-next-fastapi" d="M 450 250 C 550 250, 550 450, 650 450" />
    <!-- Appsmith -> FastAPI -->
    <path id="path-appsmith-fastapi" d="M 450 400 L 650 450" />
    <!-- Mattermost -> n8n/FastAPI -->
    <path id="path-mattermost-n8n" d="M 450 700 L 650 700" />

    <!-- Keycloak -> DB -->
    <path id="path-keycloak-db" d="M 750 250 C 950 250, 1050 350, 1150 350" />

    <!-- FastAPI -> Event Bus -->
    <path id="path-fastapi-redis" d="M 750 450 L 850 450" />
    
    <!-- n8n -> Event Bus -->
    <path id="path-n8n-redis" d="M 750 700 C 850 700, 850 500, 900 500" />

    <!-- FastAPI -> DB -->
    <path id="path-fastapi-db" d="M 750 450 C 950 450, 1050 350, 1150 350" />

    <!-- FastAPI -> Qdrant -->
    <path id="path-fastapi-qdrant" d="M 750 450 C 950 450, 1050 550, 1150 550" />

    <!-- FastAPI -> Local LLM -->
    <path id="path-fastapi-llm" d="M 750 450 C 950 450, 1050 700, 1150 700" />
  </g>

  <!-- Components -->

  <!-- 1. EXTERNAL -->
  <g transform="translate(100, 410)" filter="url(#shadow-lg)">
    <rect width="100" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle cx="25" cy="20" r="5" fill="#f43f5e" />
    <circle cx="45" cy="20" r="5" fill="#f59e0b" />
    <circle cx="65" cy="20" r="5" fill="#10b981" />
    <text x="50" y="55" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Browser</text>
  </g>

  <g transform="translate(200, 410)" filter="url(#shadow-lg)">
    <rect width="100" height="80" rx="12" fill="url(#color-indigo)" />
    <text x="50" y="40" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Traefik</text>
    <text x="50" y="60" fill="#c7d2fe" font-family="system-ui" font-size="11" text-anchor="middle">API Gateway</text>
  </g>

  <!-- 2. FRONTEND & APPS -->
  <g transform="translate(350, 210)" filter="url(#shadow-lg)">
    <rect width="120" height="80" rx="12" fill="url(#color-cyan)" />
    <text x="60" y="40" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Next.js</text>
    <text x="60" y="60" fill="#cffafe" font-family="system-ui" font-size="11" text-anchor="middle">Launchpad UI</text>
  </g>

  <g transform="translate(350, 360)" filter="url(#shadow-lg)">
    <rect width="120" height="80" rx="12" fill="#d97706" />
    <text x="60" y="40" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Appsmith</text>
    <text x="60" y="60" fill="#fef3c7" font-family="system-ui" font-size="11" text-anchor="middle">Low-code UI</text>
  </g>

  <g transform="translate(350, 510)" filter="url(#shadow-lg)">
    <rect width="120" height="80" rx="12" fill="#2563eb" />
    <text x="60" y="40" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Metabase</text>
    <text x="60" y="60" fill="#dbeafe" font-family="system-ui" font-size="11" text-anchor="middle">BI Dashboard</text>
  </g>

  <g transform="translate(350, 660)" filter="url(#shadow-lg)">
    <rect width="120" height="80" rx="12" fill="#0284c7" />
    <text x="60" y="40" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Mattermost</text>
    <text x="60" y="60" fill="#e0f2fe" font-family="system-ui" font-size="11" text-anchor="middle">Chat &amp; Notify</text>
  </g>

  <!-- 3. CORE ENGINE -->
  <g transform="translate(650, 210)" filter="url(#shadow-lg)">
    <rect width="120" height="80" rx="12" fill="url(#color-purple)" />
    <text x="60" y="40" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Keycloak</text>
    <text x="60" y="60" fill="#ddd6fe" font-family="system-ui" font-size="11" text-anchor="middle">SSO / IAM</text>
  </g>

  <g transform="translate(650, 410)" filter="url(#shadow-lg)">
    <rect width="160" height="90" rx="12" fill="url(#color-emerald)" />
    <text x="80" y="45" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="bold" text-anchor="middle">FastAPI Core</text>
    <text x="80" y="65" fill="#a7f3d0" font-family="system-ui" font-size="11" text-anchor="middle">Agents &amp; Core Logic</text>
  </g>

  <g transform="translate(650, 660)" filter="url(#shadow-lg)">
    <rect width="120" height="80" rx="12" fill="#ea580c" />
    <text x="60" y="40" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">n8n Workflow</text>
    <text x="60" y="60" fill="#ffedd5" font-family="system-ui" font-size="11" text-anchor="middle">Automation</text>
  </g>

  <!-- EVENT BUS -->
  <g transform="translate(850, 400)" filter="url(#shadow-lg)">
    <rect width="120" height="110" rx="12" fill="url(#color-rose)" />
    <path d="M 60 20 L 90 35 L 90 65 L 60 80 L 30 65 L 30 35 Z" fill="#ffffff" fill-opacity="0.2" />
    <text x="60" y="55" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Redis</text>
    <text x="60" y="75" fill="#ffe4e6" font-family="system-ui" font-size="11" text-anchor="middle">Event Bus &amp; Cache</text>
  </g>

  <!-- 4. DATA & AI -->
  <g transform="translate(1150, 310)" filter="url(#shadow-lg)">
    <path d="M 0 20 C 0 0, 120 0, 120 20 L 120 60 C 120 80, 0 80, 0 60 Z" fill="url(#color-amber)" />
    <path d="M 0 20 C 0 40, 120 40, 120 20" fill="none" stroke="#b45309" stroke-width="2" />
    <text x="60" y="55" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">PostgreSQL</text>
    <text x="60" y="70" fill="#fef3c7" font-family="system-ui" font-size="10" text-anchor="middle">Relational Data</text>
  </g>

  <g transform="translate(1150, 510)" filter="url(#shadow-lg)">
    <path d="M 0 20 C 0 0, 120 0, 120 20 L 120 60 C 120 80, 0 80, 0 60 Z" fill="#6366f1" />
    <path d="M 0 20 C 0 40, 120 40, 120 20" fill="none" stroke="#4338ca" stroke-width="2" />
    <text x="60" y="55" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Qdrant</text>
    <text x="60" y="70" fill="#e0e7ff" font-family="system-ui" font-size="10" text-anchor="middle">Vector DB</text>
  </g>

  <g transform="translate(1150, 660)" filter="url(#shadow-lg)">
    <rect width="120" height="80" rx="12" fill="url(#color-pink)" />
    <text x="60" y="40" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Local LLM</text>
    <text x="60" y="60" fill="#fbcfe8" font-family="system-ui" font-size="11" text-anchor="middle">vLLM / Ollama</text>
  </g>

  <!-- ANIMATIONS (Packets) -->
  
  <!-- Ingress Traffic -->
  <circle r="4" fill="#0ea5e9" filter="url(#glow-cyan)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 150 450 L 250 450" />
  </circle>

  <!-- Traefik -> Next.js -->
  <circle r="4" fill="#0ea5e9" filter="url(#glow-cyan)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.5s" path="M 250 450 L 350 250" />
  </circle>

  <!-- Traefik -> FastAPI -->
  <circle r="4" fill="#10b981" filter="url(#glow-cyan)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="1s" path="M 250 450 C 350 450, 500 450, 650 450" />
  </circle>

  <!-- Traefik -> Keycloak -->
  <circle r="4" fill="#a855f7" filter="url(#glow-purple)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="0s" path="M 250 450 C 350 450, 500 250, 650 250" />
  </circle>

  <!-- Next.js -> FastAPI -->
  <circle r="4" fill="#0ea5e9" filter="url(#glow-cyan)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1s" path="M 450 250 C 550 250, 550 450, 650 450" />
  </circle>

  <!-- FastAPI -> Event Bus (Redis) -->
  <circle r="4" fill="#f43f5e" filter="url(#glow-rose)">
    <animateMotion dur="1s" repeatCount="indefinite" begin="0s" path="M 750 450 L 850 450" />
  </circle>
  
  <!-- FastAPI -> Database -->
  <circle r="4" fill="#f59e0b" filter="url(#glow-amber)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.5s" path="M 750 450 C 950 450, 1050 350, 1150 350" />
  </circle>

  <!-- Keycloak -> Database -->
  <circle r="4" fill="#f59e0b" filter="url(#glow-amber)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1.5s" path="M 750 250 C 950 250, 1050 350, 1150 350" />
  </circle>

  <!-- FastAPI -> Qdrant -->
  <circle r="4" fill="#6366f1" filter="url(#glow-purple)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1s" path="M 750 450 C 950 450, 1050 550, 1150 550" />
  </circle>

  <!-- FastAPI -> Local LLM -->
  <circle r="4" fill="#ec4899" filter="url(#glow-purple)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="0.5s" path="M 750 450 C 950 450, 1050 700, 1150 700" />
  </circle>

  <!-- Local LLM -> FastAPI (Return) -->
  <circle r="4" fill="#ffffff" filter="url(#glow-purple)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="1.5s" path="M 1150 700 C 1050 700, 950 450, 750 450" />
  </circle>

  <!-- n8n -> Event Bus (Redis) -->
  <circle r="4" fill="#f43f5e" filter="url(#glow-rose)">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="1s" path="M 750 700 C 850 700, 850 500, 900 500" />
  </circle>

</svg>
