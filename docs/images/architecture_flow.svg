<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Component Gradients -->
    <linearGradient id="comp-ui" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="comp-backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="comp-db" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="comp-auth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="comp-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>

    <!-- Glow for packets -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="15" />
  <text x="500" y="40" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Proteus OS Architecture &amp; Data Flow</text>

  <!-- Paths -->
  <!-- Browser to Traefik -->
  <path id="path-b-t" d="M 150 300 L 250 300" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5,5" />
  <!-- Traefik to Next.js -->
  <path id="path-t-n" d="M 350 300 L 450 150" fill="none" stroke="#475569" stroke-width="2" />
  <!-- Traefik to FastAPI -->
  <path id="path-t-f" d="M 350 300 L 450 300" fill="none" stroke="#475569" stroke-width="2" />
  <!-- Traefik to Keycloak -->
  <path id="path-t-k" d="M 350 300 L 450 450" fill="none" stroke="#475569" stroke-width="2" />
  
  <!-- Next.js to FastAPI -->
  <path id="path-n-f" d="M 550 150 L 650 300" fill="none" stroke="#475569" stroke-width="2" />
  <!-- FastAPI to Postgres -->
  <path id="path-f-p" d="M 650 300 L 750 300" fill="none" stroke="#475569" stroke-width="2" />
  <!-- FastAPI to AI -->
  <path id="path-f-a" d="M 550 300 L 750 150" fill="none" stroke="#475569" stroke-width="2" />
  <!-- Keycloak to Postgres -->
  <path id="path-k-p" d="M 550 450 L 750 300" fill="none" stroke="#475569" stroke-width="2" />

  <!-- Components -->
  
  <!-- Browser -->
  <g transform="translate(50, 260)" filter="url(#shadow)">
    <rect width="100" height="80" rx="10" fill="#334155" stroke="#475569" stroke-width="2" />
    <circle cx="20" cy="20" r="4" fill="#ef4444" />
    <circle cx="35" cy="20" r="4" fill="#f59e0b" />
    <circle cx="50" cy="20" r="4" fill="#10b981" />
    <text x="50" y="50" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Browser</text>
  </g>

  <!-- Traefik Proxy -->
  <g transform="translate(250, 260)" filter="url(#shadow)">
    <rect width="100" height="80" rx="10" fill="#334155" stroke="#475569" stroke-width="2" />
    <text x="50" y="45" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Traefik</text>
    <text x="50" y="65" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">Edge Router</text>
  </g>

  <!-- Next.js BFF -->
  <g transform="translate(450, 110)" filter="url(#shadow)">
    <rect width="100" height="80" rx="10" fill="url(#comp-ui)" />
    <text x="50" y="45" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Next.js BFF</text>
    <text x="50" y="65" fill="#bfdbfe" font-family="system-ui" font-size="10" text-anchor="middle">Launchpad UI</text>
  </g>

  <!-- Keycloak Auth -->
  <g transform="translate(450, 410)" filter="url(#shadow)">
    <rect width="100" height="80" rx="10" fill="url(#comp-auth)" />
    <text x="50" y="45" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Keycloak</text>
    <text x="50" y="65" fill="#ddd6fe" font-family="system-ui" font-size="10" text-anchor="middle">Identity Provider</text>
  </g>

  <!-- FastAPI Core -->
  <g transform="translate(450, 260)" filter="url(#shadow)">
    <rect width="200" height="80" rx="10" fill="url(#comp-backend)" />
    <text x="100" y="45" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="bold" text-anchor="middle">FastAPI Core Engine</text>
    <text x="100" y="65" fill="#a7f3d0" font-family="system-ui" font-size="12" text-anchor="middle">Orchestrator &amp; Plugins</text>
  </g>

  <!-- AI / Local LLM -->
  <g transform="translate(750, 110)" filter="url(#shadow)">
    <rect width="100" height="80" rx="10" fill="url(#comp-ai)" />
    <text x="50" y="45" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Local LLM</text>
    <text x="50" y="65" fill="#fbcfe8" font-family="system-ui" font-size="10" text-anchor="middle">AI Copilot</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(750, 260)" filter="url(#shadow)">
    <path d="M 0 20 C 0 0, 100 0, 100 20 L 100 60 C 100 80, 0 80, 0 60 Z" fill="url(#comp-db)" />
    <path d="M 0 20 C 0 40, 100 40, 100 20" fill="none" stroke="#d97706" stroke-width="2" />
    <text x="50" y="55" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Animated Packets -->
  
  <!-- HTTP Request (Browser -> Traefik) -->
  <circle r="4" fill="#60a5fa" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 150 300 L 250 300" />
  </circle>

  <!-- Routing to UI (Traefik -> Next.js) -->
  <circle r="4" fill="#3b82f6" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="1s" path="M 350 300 L 450 150" />
  </circle>

  <!-- Routing to Backend (Traefik -> FastAPI) -->
  <circle r="4" fill="#10b981" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="0.5s" path="M 350 300 L 450 300" />
  </circle>

  <!-- BFF API Call (Next.js -> FastAPI) -->
  <circle r="4" fill="#3b82f6" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1.5s" path="M 550 150 L 550 260" />
  </circle>

  <!-- Auth Call (Traefik -> Keycloak) -->
  <circle r="4" fill="#8b5cf6" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0s" path="M 350 300 L 450 450" />
  </circle>

  <!-- Database Query (FastAPI -> Postgres) -->
  <circle r="4" fill="#f59e0b" filter="url(#glow)">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="1s" path="M 650 300 L 750 300" />
  </circle>

  <!-- Auth DB Query (Keycloak -> Postgres) -->
  <circle r="4" fill="#f59e0b" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1.5s" path="M 550 450 L 750 340" />
  </circle>

  <!-- AI Inference (FastAPI -> AI) -->
  <circle r="4" fill="#ec4899" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.5s" path="M 650 260 L 750 150" />
  </circle>

  <!-- Return Packets (AI -> FastAPI) -->
  <circle r="4" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1.5s" path="M 750 150 L 650 260" />
  </circle>

  <!-- Return Packets (FastAPI -> Traefik) -->
  <circle r="4" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="2s" path="M 450 300 L 350 300" />
  </circle>

  <!-- Return Packets (Traefik -> Browser) -->
  <circle r="4" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.5s" path="M 250 300 L 150 300" />
  </circle>
</svg>
