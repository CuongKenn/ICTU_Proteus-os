#
# Proteus OS — Docker Compose Stack (Full)
# Tham chiếu kiến trúc: docs/architecture.md, docs/deployment.md
# Tất cả dịch vụ đặt trong network nội bộ "proteus-net".
# Traefik là điểm vào duy nhất từ bên ngoài.
#
# Sử dụng: cp .env.example .env → điền giá trị → docker compose up -d

services:

  # ────────────────────────────────────────────────────────────
  # TRAEFIK — Edge Proxy (Ingress)
  # ────────────────────────────────────────────────────────────
  traefik:
    # NOTE 09/2026: Docker Engine 29 yêu cầu Docker API >= 1.44.
    # Traefik <= v3.5 gửi API 1.24 nên provider docker gãy (404 toàn bộ).
    # Ghim v3.7 (client tự negotiate API) — kiểm tra `traefik version` khi nâng Docker.
    image: traefik:v3.7
    container_name: proteus-traefik
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-certs:/letsencrypt
    networks:
      proteus-net:
        aliases:
          - auth.proteus.local  # Internal containers reach Keycloak via Traefik -> proper X-Forwarded headers -> correct port in OIDC discovery
    labels:
      - "proteus.log=true"
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Middleware allow iframe embedding for apps
      - "traefik.http.middlewares.iframe-allow.headers.customresponseheaders.X-Frame-Options="
      - "traefik.http.middlewares.iframe-allow.headers.customresponseheaders.Content-Security-Policy=frame-ancestors 'self' http://${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX} https://${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}"

  # ────────────────────────────────────────────────────────────
  # POSTGRESQL — Primary Database
  # ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.4
    container_name: proteus-postgres
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proteus}
      POSTGRES_USER: ${POSTGRES_USER:-proteus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PG18+: mount ở /var/lib/postgresql (cha), data nằm ở subdir theo
      # major version (pg_ctlcluster layout). Mount trực tiếp .../data bị từ chối.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - proteus-net
    healthcheck:
      # NOTE: phải chỉ rõ -d ${POSTGRES_DB}. Nếu chỉ -U mà không -d,
      # pg_isready mặc định thử DB trùng tên user (VD: AdminProteus) vốn
      # không tồn tại → log "FATAL: database ... does not exist" liên tục.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proteus} -d ${POSTGRES_DB:-proteus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "proteus.log=true"

  # ────────────────────────────────────────────────────────────
  # POSTGRES-BACKUP — Automated Database Backup
  # ────────────────────────────────────────────────────────────
  postgres-backup:
    # Image postgres:16.4-alpine (busybox crond + /etc/crontabs sẵn có).
    # Image postgres:16 (Debian) KHÔNG có crond → container crash-loop
    # "exec: crond: not found" + "cannot create /etc/crontabs/root".
    image: postgres:16.4-alpine
    container_name: proteus-postgres-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-proteus}
      POSTGRES_USER: ${POSTGRES_USER:-proteus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL}
    volumes:
      - ${BACKUP_DIR:-./backups/postgres}:/backups
      - ./scripts:/scripts:ro
    command: /scripts/start_cron.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"

  # ────────────────────────────────────────────────────────────
  # REDIS — Event Bus (Pub/Sub) + Cache
  # ────────────────────────────────────────────────────────────
  redis:
    # Ghim 7.2.16-alpine: dòng 7.2.x cuối cùng còn BSD-3-Clause (OSI).
    # KHÔNG dùng :latest (Redis ≥7.4 đổi sang RSALv2/SSPL, không phải OSI).
    image: redis:7.2.16-alpine
    container_name: proteus-redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    user: "999:999"
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1
    volumes:
      - redis-data:/data
    networks:
      - proteus-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "proteus.log=true"

  # ────────────────────────────────────────────────────────────
  # KEYCLOAK — SSO / Identity Provider
  # ────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: proteus-keycloak
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # NOTE: DB config comes from KC_DB* env vars below — do NOT append
    # --db=... on the command line. --db is a build-time option and is
    # rejected when combined with `start --optimized`. Likewise --optimized
    # requires a prior `kc.sh build`, so the default production mode is
    # plain `start` (see KEYCLOAK_START_MODE in .env.example).
    command: ${KEYCLOAK_START_MODE:-start-dev} --import-realm
    environment:

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-proteus}
      KC_DB_USERNAME: ${POSTGRES_USER:-proteus}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_SCHEME:-http}://auth.${DOMAIN}${PUBLIC_URL_SUFFIX}
      KC_HOSTNAME_STRICT: "false"        # Allow HTTP in dev; don't enforce HTTPS-only hostnames
      KC_HOSTNAME_STRICT_HTTPS: "false"  # Don't redirect HTTP -> HTTPS
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Fix "Cookie not found" on HTTP: Chrome rejects SameSite=None without Secure.
      # Setting SameSite=Lax allows AUTH_SESSION_ID cookie to work over plain HTTP.
      JAVA_OPTS_APPEND: >-
        -Dkeycloak.cookies.auth-session-id.same-site=Lax
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/theme/proteus:/opt/keycloak/themes/proteus:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s   # Keycloak khởi động chậm — chờ trước khi báo healthy
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  # ────────────────────────────────────────────────────────────
  # QDRANT — Vector Database (RAG / AI)
  # ────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: proteus-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"
    # Không expose ra ngoài — chỉ backend gọi qua internal network

  # ────────────────────────────────────────────────────────────
  # OLLAMA — Local LLM Provider (Optional)
  # ────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.3.14
    container_name: proteus-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    # Dùng GPU host khi có (inference nhanh gấp hàng chục lần CPU).
    # Docker CDI (nvidia.com/gpu) đã có sẵn trên máy. Nếu host không có GPU,
    # bỏ block deploy này để chạy CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - proteus-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "proteus.log=true"

  ollama-init:
    image: curlimages/curl:8.9.1
    container_name: proteus-ollama-init
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - proteus-net
    command: >
      sh -c "echo 'Fetching qwen3:8b...' && curl -X POST http://ollama:11434/api/pull -d '{"name": "qwen3:8b"}' && echo 'Done!'"
    labels:
      - "proteus.log=true"

  # ────────────────────────────────────────────────────────────
  # vLLM — High-Performance Local LLM (Optional)
  # ────────────────────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:v0.5.4
    container_name: proteus-vllm
    restart: unless-stopped
    profiles: ["vllm"]
    command: --model meta-llama/Llama-2-7b-chat-hf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - vllm-data:/root/.cache/huggingface
    networks:
      - proteus-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "proteus.log=true"

  # ────────────────────────────────────────────────────────────
  # N8N — Workflow Automation Engine
  # ────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.54.4
    container_name: proteus-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-proteus}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-proteus}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_HOST: workflow.${DOMAIN}${PUBLIC_URL_SUFFIX}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${PUBLIC_SCHEME:-http}://workflow.${DOMAIN}${PUBLIC_URL_SUFFIX}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
      N8N_BASIC_AUTH_ACTIVE: "false"   # Auth qua Keycloak OIDC
      N8N_DISABLE_UI_SECURITY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`workflow.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.http.routers.n8n.middlewares=iframe-allow"

  # ────────────────────────────────────────────────────────────
  # MATTERMOST — Chat & Collaboration
  # ────────────────────────────────────────────────────────────
  mattermost:
    image: mattermost/mattermost-team-edition:10.0.2
    container_name: proteus-mattermost
    restart: unless-stopped
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER:-proteus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-proteus}?sslmode=disable&connect_timeout=10&search_path=mattermost
      - MM_BLEVESETTINGS_INDEXDIR=/mattermost/bleve-indexes
      - MM_SERVICESETTINGS_SITEURL=${PUBLIC_SCHEME:-http}://chat.${DOMAIN}${PUBLIC_URL_SUFFIX}
      - MM_PLUGINSETTINGS_CLIENTDIRECTORY=/mattermost/client/plugins
      # Bật Local Mode để quản trị bằng mmctl từ host (socket nội bộ container,
      # không expose ra ngoài). Cần cho setup.sh tạo sysadmin/bot khi DB trắng.
      - MM_SERVICESETTINGS_ENABLELOCALMODE=true
      # Tắt telemetry Rudder (môi trường chặn internet → spam 502 trong log)
      - MM_LOGSETTINGS_ENABLEDIAGNOSTICS=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mattermost-data:/mattermost/data
      - mattermost-config:/mattermost/config
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
      - mattermost-bleve-indexes:/mattermost/bleve-indexes
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"
      - "traefik.enable=true"
      - "traefik.http.routers.mattermost.rule=Host(`chat.${DOMAIN}`)"
      - "traefik.http.routers.mattermost.entrypoints=web"
      - "traefik.http.services.mattermost.loadbalancer.server.port=8065"
      - "traefik.http.routers.mattermost.middlewares=iframe-allow"

  # ────────────────────────────────────────────────────────────
  # METABASE — Business Intelligence / Dashboard
  # ────────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:v0.49.9
    container_name: proteus-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-proteus}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_SITE_URL: ${PUBLIC_SCHEME:-http}://analytics.${DOMAIN}${PUBLIC_URL_SUFFIX}
      MB_REDIRECT_ALL_REQUESTS_TO_HTTPS: "false"
      MB_EMBEDDING_APP_ORIGIN: ${PUBLIC_SCHEME:-http}://${DOMAIN}${PUBLIC_URL_SUFFIX}
      # Jetty mặc định chỉ cho header 8KB → browser mang nhiều cookie SSO
      # (Keycloak/NextAuth JWT) dễ vượt và nhận 431. Nâng lên 32KB.
      MB_JETTY_REQUEST_HEADER_SIZE: "32768"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase-data:/metabase-data
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`analytics.${DOMAIN}`)"
      - "traefik.http.routers.metabase.entrypoints=web"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
      - "traefik.http.routers.metabase.middlewares=iframe-allow"

  # ────────────────────────────────────────────────────────────
  # APPSMITH — Low-Code UI Builder
  # ────────────────────────────────────────────────────────────
  appsmith:
    image: appsmith/appsmith-ce:v1.35
    container_name: proteus-appsmith
    restart: unless-stopped
    environment:
      APPSMITH_DISABLE_TELEMETRY: "true"
      APPSMITH_OAUTH2_GITHUB_CLIENT_ID: appsmith
      APPSMITH_OAUTH2_GITHUB_CLIENT_SECRET: ${APPSMITH_OIDC_SECRET:-}
      APPSMITH_OAUTH2_GITHUB_AUTH_URL: ${PUBLIC_SCHEME:-http}://auth.${DOMAIN}${PUBLIC_URL_SUFFIX}/realms/proteus/protocol/openid-connect/auth
      APPSMITH_OAUTH2_GITHUB_TOKEN_URL: http://keycloak:8080/realms/proteus/protocol/openid-connect/token
      APPSMITH_OAUTH2_GITHUB_PROFILE_URL: http://keycloak:8080/realms/proteus/protocol/openid-connect/userinfo
    volumes:
      - appsmith-data:/appsmith-stacks
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"
      - "traefik.enable=true"
      - "traefik.http.routers.appsmith.rule=Host(`apps.${DOMAIN}`) || PathPrefix(`/proxy/appsmith`)"
      - "traefik.http.routers.appsmith.entrypoints=web"
      - "traefik.http.services.appsmith.loadbalancer.server.port=80"
      - "traefik.http.routers.appsmith.middlewares=iframe-allow"

  # ────────────────────────────────────────────────────────────
  # OUTLINE — Wiki / Knowledge Base
  # ────────────────────────────────────────────────────────────
  outline:
    image: outlinewiki/outline:0.76.1
    container_name: proteus-outline
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-proteus}:${POSTGRES_PASSWORD}@postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      URL: ${PUBLIC_SCHEME:-http}://wiki.${DOMAIN}${PUBLIC_URL_SUFFIX}
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      OIDC_CLIENT_ID: outline
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_SECRET}
      OIDC_AUTH_URI: ${PUBLIC_SCHEME:-http}://auth.${DOMAIN}${PUBLIC_URL_SUFFIX}/realms/proteus/protocol/openid-connect/auth
      OIDC_TOKEN_URI: http://keycloak:8080/realms/proteus/protocol/openid-connect/token
      OIDC_USERINFO_URI: http://keycloak:8080/realms/proteus/protocol/openid-connect/userinfo
      OIDC_USERNAME_CLAIM: preferred_username
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FORCE_HTTPS: "${OUTLINE_FORCE_HTTPS:-false}"
      OIDC_DISPLAY_NAME: Proteus SSO
      OIDC_SCOPES: openid profile email
      # NOTE: Outline không hỗ trợ DATABASE_SCHEMA env var.
      # Schema 'outline' được tạo sẵn trong init.sql.
      # Để force Outline dùng schema 'outline', cần cấu hình search_path tại cấp PostgreSQL role.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - outline-data:/var/lib/outline/data
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"
      - "traefik.enable=true"
      - "traefik.http.routers.outline.rule=Host(`wiki.${DOMAIN}`)"
      - "traefik.http.routers.outline.entrypoints=web"
      - "traefik.http.services.outline.loadbalancer.server.port=3000"
      - "traefik.http.routers.outline.middlewares=iframe-allow"

  # ────────────────────────────────────────────────────────────
  # OBSERVABILITY — Grafana, Loki, Promtail
  # ────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: proteus-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
      - ./loki/config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - proteus-net

  promtail:
    # NOTE 09/2026: promtail 2.9.8 gửi Docker API 1.42, bị Docker Engine 29
    # từ chối (yêu cầu ≥1.44) → không discovery được container → Loki mất log.
    # Nâng lên 3.5 (tương thích push API với Loki 2.9.8, giữ nguyên loki).
    image: grafana/promtail:3.5
    container_name: proteus-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - proteus-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.4.3
    container_name: proteus-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - proteus-net
    depends_on:
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${DOMAIN}`) && PathPrefix(`/monitoring/`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ────────────────────────────────────────────────────────────
  # CORE ENGINE — Backend (FastAPI)
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../core-engine
      dockerfile: Dockerfile
      target: backend
    container_name: proteus-backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-proteus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-proteus}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-proteus}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_BFF_CLIENT_ID:-proteus-bff}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      N8N_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY}
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: '["${PUBLIC_SCHEME:-http}://${DOMAIN}${PUBLIC_URL_SUFFIX}","http://localhost:3000"]'
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen3:8b}
      METABASE_SECRET_KEY: ${METABASE_SECRET_KEY}
      METABASE_SITE_URL: ${PUBLIC_SCHEME:-http}://analytics.${DOMAIN}${PUBLIC_URL_SUFFIX}
      METABASE_INTERNAL_URL: http://metabase:3000
      APPSMITH_URL: ${APPSMITH_URL}
      APPSMITH_API_KEY: ${APPSMITH_API_KEY}
      MATTERMOST_URL: ${MATTERMOST_URL}
      MATTERMOST_BOT_TOKEN: ${MATTERMOST_BOT_TOKEN}
      MATTERMOST_WEBHOOK_SECRET: ${MATTERMOST_WEBHOOK_SECRET}
      MATTERMOST_SYSTEM_CHANNEL_ID: ${MATTERMOST_SYSTEM_CHANNEL_ID}
      PLUGINS_MFE_URL: ${PLUGINS_MFE_URL:-http://plugins.proteus.local}
      PLUGINS_DIR: /plugins
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../plugins:/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy  # Backend cần Keycloak để fetch JWKS khi startup
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api/v1`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=10"   # Cao hơn frontend (1) — PathPrefix cụ thể hơn
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  # ────────────────────────────────────────────────────────────
  # CORE ENGINE — Frontend (Next.js BFF)
  # ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../core-engine
      dockerfile: Dockerfile
      target: frontend
      args:
        NEXT_PUBLIC_MATTERMOST_URL: ${PUBLIC_SCHEME:-http}://chat.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
        NEXT_PUBLIC_OUTLINE_URL: ${PUBLIC_SCHEME:-http}://wiki.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
        NEXT_PUBLIC_N8N_URL: ${PUBLIC_SCHEME:-http}://workflow.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
        NEXT_PUBLIC_METABASE_URL: ${PUBLIC_SCHEME:-http}://analytics.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
        NEXT_PUBLIC_APPSMITH_URL: ${PUBLIC_SCHEME:-http}://apps.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
        NEXT_PUBLIC_KEYCLOAK_URL: ${PUBLIC_SCHEME:-http}://auth.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
    container_name: proteus-frontend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      # Bind 0.0.0.0: Docker gán HOSTNAME=<container-id> khiến Next standalone
      # chỉ nghe trên IP eth0 → healthcheck 127.0.0.1 fail → Traefik lọc bỏ router.
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${PUBLIC_SCHEME:-http}://${DOMAIN}${PUBLIC_URL_SUFFIX}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_BFF_CLIENT_ID:-proteus-bff}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET}
      KEYCLOAK_ISSUER: ${PUBLIC_SCHEME:-http}://auth.${DOMAIN}${PUBLIC_URL_SUFFIX}/realms/${KEYCLOAK_REALM:-proteus}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_MATTERMOST_URL: ${PUBLIC_SCHEME:-http}://chat.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
      NEXT_PUBLIC_OUTLINE_URL: ${PUBLIC_SCHEME:-http}://wiki.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
      NEXT_PUBLIC_N8N_URL: ${PUBLIC_SCHEME:-http}://workflow.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
      NEXT_PUBLIC_METABASE_URL: ${PUBLIC_SCHEME:-http}://analytics.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
      NEXT_PUBLIC_APPSMITH_URL: ${PUBLIC_SCHEME:-http}://apps.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
      NEXT_PUBLIC_KEYCLOAK_URL: ${PUBLIC_SCHEME:-http}://auth.${DOMAIN:-proteus.local}${PUBLIC_URL_SUFFIX}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - backend
    networks:
      - proteus-net
    labels:
      - "proteus.log=true"
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=2"   # Cao hơn http-catchall (=1) để không bị catch-all nuốt; backend (=10) vẫn cao nhất



  # ────────────────────────────────────────────────────────────
  # PLUGIN MICRO-FRONTEND GATEWAY
  # ────────────────────────────────────────────────────────────
  plugins-mfe:
    build:
      # Context là toàn bộ ../plugins để Dockerfile COPY được
      # source of truth plugins/<code>/frontend vào gateway.
      context: ../plugins
      dockerfile: mfe-gateway/Dockerfile
    container_name: proteus-plugins-mfe
    restart: unless-stopped
    networks:
      - proteus-net
    labels:
      - "traefik.enable=true"
      # Path-based routing: plugins.proteus.local/{plugin-code-name}
      # BẮT BUỘC thêm plugins.${DOMAIN} vào /etc/hosts (xem setup.sh)
      - "traefik.http.routers.plugins-mfe.rule=Host(`plugins.${DOMAIN}`)"
      - "traefik.http.routers.plugins-mfe.entrypoints=web"
      - "traefik.http.services.plugins-mfe.loadbalancer.server.port=3001"
      # Cho phép Iframe
      - "traefik.http.routers.plugins-mfe.middlewares=iframe-allow"

networks:
  proteus-net:
    name: proteus-net
    driver: bridge

volumes:
  traefik-certs:
  postgres-data:
  redis-data:
  qdrant-data:
  n8n-data:
  metabase-data:
  appsmith-data:
  outline-data:
  loki-data:
  grafana-data:
  mattermost-data:
  mattermost-config:
  mattermost-logs:
  mattermost-plugins:
  mattermost-client-plugins:
  mattermost-bleve-indexes:
  ollama-data:
  vllm-data:
