server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_proteus_log']
        regex: 'true'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    # Pipeline tối giản: chỉ bóc envelope docker, giữ nguyên message gốc.
    # (Trước đây có thêm json{job}→labels{job} nhưng stage `labels` với giá trị
    # rỗng khiến Loki 400 "at least one label pair is required" trên promtail 3.x.
    # Nhãn container/service/stream từ relabel là đủ để tra cứu.)
    pipeline_stages:
      - docker: {}
