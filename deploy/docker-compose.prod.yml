# Proteus OS — Docker Compose Production Overlay (TLS)
# File này CHỈ chứa phần khác biệt của production so với docker-compose.yml:
#   - Mọi router public chuyển sang entrypoint `websecure` + TLS (Let's Encrypt).
#   - Router catch-all chuyển hướng toàn bộ HTTP → HTTPS.
# Tham chiếu: docs/deployment.md
#
# Sử dụng: được tự động kích hoạt bởi setup.sh / setup.ps1 ở production mode
# qua biến COMPOSE_FILE trong deploy/.env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# Chạy thủ công:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# LƯU Ý: labels được merge theo key với docker-compose.yml, nên ở đây chỉ cần
# ghi đè entrypoints + bổ sung tls — các rule/service/port giữ nguyên.

services:

  # ────────────────────────────────────────────────────────────
  # TRAEFIK — Dashboard (TLS) + HTTP→HTTPS catch-all
  # ────────────────────────────────────────────────────────────
  traefik:
    labels:
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      # Bắt mọi request HTTP còn lại và redirect sang HTTPS — NHƯNG loại trừ
      # `/.well-known/acme-challenge/` để Let's Encrypt HTTP-01 không bị
      # redirect sang https (trước đây challenge bị 404 vì đi nhầm vào
      # entrypoint websecure + bị rate-limit 429).
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`) && !PathPrefix(`/.well-known/acme-challenge/`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=https-redirect"
      - "traefik.http.routers.http-catchall.priority=1"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

  keycloak:
    labels:
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"

  n8n:
    labels:
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"

  mattermost:
    labels:
      - "traefik.http.routers.mattermost.entrypoints=websecure"
      - "traefik.http.routers.mattermost.tls=true"
      - "traefik.http.routers.mattermost.tls.certresolver=letsencrypt"

  metabase:
