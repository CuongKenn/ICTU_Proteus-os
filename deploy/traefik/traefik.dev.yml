# Traefik Static Configuration — LOCAL DEV template
# File này được setup.sh / setup.ps1 copy thành traefik.yml khi chọn mode "local".
# Tham chiếu: docs/deployment.md §2
#
# Dev: HTTP only (:80), dashboard mở không auth, KHÔNG có Let's Encrypt.

api:
  dashboard: true
  insecure: true   # Dev only. Production dùng traefik.prod.yml (insecure: false + TLS)

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false   # Service phải có label traefik.enable=true
    network: proteus-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        Authorization: redact   # Ẩn JWT trong access log
