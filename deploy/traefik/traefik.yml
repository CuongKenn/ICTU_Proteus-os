# Traefik Static Configuration (file đang dùng — được mount vào container)
# Tham chiếu: docs/deployment.md §2
#
# LƯU Ý: file này do setup.sh / setup.ps1 TỰ SINH theo mode đã chọn
# (copy từ traefik.dev.yml hoặc render từ traefik.prod.yml).
# Muốn sửa static config: sửa 2 file template, rồi chạy lại setup script.

api:
  dashboard: true
  insecure: true   # Dev only. Production: insecure: false + TLS (xem traefik.prod.yml)

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false   # Service phải có label traefik.enable=true
    network: proteus-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        Authorization: redact   # Ẩn JWT trong access log
