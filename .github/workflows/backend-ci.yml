# Backend CI — Lint, Security Scan, Alembic Migration Check, Tests & Coverage
# Tham chiếu: ICTU-AI-JUDGE/backend-ci.yml (adapted for Proteus OS monorepo)

name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'core-engine/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'core-engine/backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: core-engine/backend

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: core-engine/backend/requirements.txt

      - name: Install linters
        run: pip install flake8 black isort

      - name: Check formatting (Black)
        run: |
          black --check --diff app/ || {
            echo "::warning::Formatting issues. Run: black app/"
          }

      - name: Check import order (isort)
        run: |
          isort --check-only --diff app/ || {
            echo "::warning::Import order issues. Run: isort app/"
          }

      - name: Lint — syntax errors only (hard fail)
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — warnings (soft fail)
        run: flake8 app/ --count --max-line-length=120 --statistics --exit-zero

  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit

      - name: Run security scan
        run: |
          bandit -r app/ -ll -ii --skip B101 -f json -o bandit-report.json || true
          bandit -r app/ -ll -ii --skip B101 || echo "::warning::Security issues found (see bandit output)"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: core-engine/backend/bandit-report.json
          retention-days: 7

  migration:
    name: Alembic Migration Verification
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proteus_test
          POSTGRES_PASSWORD: proteus_test_password
          POSTGRES_DB: proteus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Keycloak không cần cho migration test
      DATABASE_URL: postgresql+asyncpg://proteus_test:proteus_test_password@localhost:5432/proteus_test
      DATABASE_URL_SYNC: postgresql://proteus_test:proteus_test_password@localhost:5432/proteus_test
      SECRET_KEY: ci-test-secret-not-for-production
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      N8N_URL: http://localhost:5678
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: proteus
      KEYCLOAK_CLIENT_ID: proteus-bff
      KEYCLOAK_CLIENT_SECRET: ci-test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: core-engine/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable PostgreSQL extensions (uuid-ossp, pgcrypto)
        run: |
          PGPASSWORD=proteus_test_password psql -h localhost -U proteus_test -d proteus_test -c "
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
          "

      - name: Run Alembic migrations (upgrade head)
        run: |
          echo "=== Running: alembic upgrade head ==="
          alembic upgrade head
          echo "=== Migration applied successfully ==="

      - name: Verify migration state
        run: |
          echo "=== Current Alembic head ==="
          alembic current
          echo ""
          echo "=== Migration history ==="
          alembic history --verbose

      - name: Check for model drift
        run: |
          alembic check 2>&1 || {
            echo "::warning::Model drift detected! Run: alembic revision --autogenerate -m 'description'"
          }

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proteus_test
          POSTGRES_PASSWORD: proteus_test_password
          POSTGRES_DB: proteus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://proteus_test:proteus_test_password@localhost:5432/proteus_test
      DATABASE_URL_SYNC: postgresql://proteus_test:proteus_test_password@localhost:5432/proteus_test
      SECRET_KEY: ci-test-secret-not-for-production
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      N8N_URL: http://localhost:5678
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: proteus
      KEYCLOAK_CLIENT_ID: proteus-bff
      KEYCLOAK_CLIENT_SECRET: ci-test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable PostgreSQL extensions
        run: |
          PGPASSWORD=proteus_test_password psql -h localhost -U proteus_test -d proteus_test -c "
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
          "

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: core-engine/backend/requirements.txt

      - name: Install dependencies + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests with coverage
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ \
              --cov=app/core \
              --cov=app/adapters \
              --cov=app/entrypoints \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing \
              --cov-fail-under=70 \
              -v --tb=short
          else
            echo "::warning::No tests/ directory yet. Skipping."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: core-engine/backend/coverage.xml
          retention-days: 7

  backend-ci:
    name: backend-ci ✅
    runs-on: ubuntu-latest
    needs: [lint, security, migration, test]
    steps:
      - name: All backend checks passed
        run: echo "All backend checks passed successfully"
