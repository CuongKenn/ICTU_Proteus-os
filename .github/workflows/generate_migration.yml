name: Generate Alembic Migration

on:
  push:
    branches:
      - feat/task-07-alembic-setup

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: proteus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          cd core-engine/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install asyncpg psycopg2-binary
          
      - name: Generate Migration
        run: |
          cd core-engine/backend
          mkdir -p migrations/versions
          export DATABASE_URL="postgresql+asyncpg://postgres:password@localhost:5432/proteus"
          export DATABASE_URL_SYNC="postgresql://postgres:password@localhost:5432/proteus"
          alembic revision --autogenerate -m "Initial migration"
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add core-engine/backend/migrations/versions/
          git commit -m "chore: autogenerate initial migration" || echo "No changes"
          git push
