# Frontend CI — ESLint, TypeScript check, Vitest tests, Next.js Production Build
# Tham chiếu: ICTU-AI-JUDGE/frontend-ci.yml (adapted for Proteus OS Next.js)

name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'core-engine/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    # Không có paths filter trên PR — để frontend-ci summary job luôn chạy
    # (Required check không được dùng paths filter — sẽ stuck "waiting" nếu workflow không trigger)

jobs:
  # Phát hiện xem có thay đổi frontend không — chạy luôn trên mọi PR
  detect-changes:
    name: Detect Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'core-engine/frontend/**'
              - '.github/workflows/frontend-ci.yml'

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: core-engine/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: core-engine/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          npx eslint src/ --max-warnings=50 || {
            echo "::error::ESLint found issues. Review warnings/errors above."
            exit 1
          }

      - name: TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: core-engine/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: core-engine/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests (Vitest)
        run: |
          if [ -d "src/__tests__" ]; then
            npm run test -- --run
          else
            echo "::warning::No __tests__ directory yet. Skipping."
          fi

  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, test]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: core-engine/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: core-engine/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production bundle
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Placeholder URLs để build không fail — giá trị thực inject lúc deploy
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-build-secret-placeholder
          NEXTAUTH_URL_INTERNAL: http://localhost:3000
          KEYCLOAK_CLIENT_ID: proteus-bff
          KEYCLOAK_CLIENT_SECRET: ci-placeholder
          KEYCLOAK_ISSUER: http://localhost:8080/realms/proteus
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

      - name: Check build output size
        run: |
          echo "=== Next.js Build Size Report ==="
          du -sh .next/ || true
          echo "--- Static files ---"
          find .next/static -name "*.js" 2>/dev/null | head -10 | xargs -I{} du -h {} | sort -rh || echo "No static JS files found"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: core-engine/frontend/.next/
          retention-days: 3

  frontend-ci:
    name: frontend-ci ✅
    runs-on: ubuntu-latest
    # Luôn chạy — kể cả khi không có thay đổi frontend (tránh PR stuck "waiting")
    if: always()
    needs: [detect-changes, lint, test, build]
    steps:
      - name: Evaluate frontend CI result
        run: |
          if [[ "${{ needs.detect-changes.outputs.frontend }}" == "false" ]]; then
            echo "⏩ No frontend changes — skipping frontend-ci checks (pass)"
            exit 0
          fi
          if [[ "${{ needs.lint.result }}" == "failure" ||
                "${{ needs.test.result }}" == "failure" ||
                "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ One or more frontend checks failed"
            exit 1
          fi
          echo "✅ All frontend checks passed"
